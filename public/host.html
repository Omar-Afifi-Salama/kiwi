<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/kiwi-icon.png" />
        <title>Club Local Drop - Host Control Center</title>
        <link rel="stylesheet" href="./css/host.css" />
        <script src="./js/host.js" defer></script>
    </head>
    <body>
        <div class="container">
            <div class="card header">
                <div>
                    <h1>🚀 Host Control Center</h1>
                    <p class="subtitle">
                        Network URL:
                        <span id="network-url" class="url-text"
                            >Loading...</span
                        >
                    </p>
                </div>
                <div class="badge-group">
                    <div class="status-badge">
                        <span>Auto-Accept:</span>
                        <button
                            onclick="toggleAutoAccept()"
                            id="auto-btn"
                            class="toggle-btn"
                        >
                            OFF
                        </button>
                    </div>
                    <div class="status-badge">
                        <div class="pulse-dot"></div>
                        <span id="client-count">0 Peers Online</span>
                    </div>
                </div>
            </div>

            <div class="grid-2">
                <div class="card">
                    <h2>📁 Upload Workshop Files</h2>
                    <form
                        action="/upload"
                        method="POST"
                        enctype="multipart/form-data"
                        class="form-group"
                    >
                        <input type="file" name="files" multiple required />
                        <button type="submit">Upload & Host</button>
                    </form>

                    <hr class="divider" />

                    <p class="subtitle" style="margin-bottom: 0.5rem">
                        ACTIVE HOSTED FILES
                    </p>
                    <div id="file-list" class="scroll-box">
                        <div class="italic-muted">No files uploaded yet.</div>
                    </div>
                </div>

                <div class="card">
                    <h2>🛡️ Permission Queue</h2>
                    <p class="subtitle" style="margin-bottom: 1rem">
                        If Auto-Accept is OFF, student download requests appear
                        here.
                    </p>
                    <div id="requests-container" class="scroll-box">
                        <div class="italic-muted">No pending requests.</div>
                    </div>
                </div>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
    </body>
</html>
