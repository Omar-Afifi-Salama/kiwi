<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/kiwi-icon.png" />
        <title>Kiwi - Download Workshop Files</title>
        <link rel="stylesheet" href="./css/index.css" />
        <script src="./js/index.js" defer></script>
    </head>
    <body>
        <div class="container">
            <h1>🥝 Kiwi Drop</h1>
            <p>
                Select a workshop file below to pull it straight from the host.
            </p>

            <div id="file-list" class="scroll-box">
                <div class="italic-muted">Loading available files...</div>
            </div>
        </div>

        <!-- Waiting Indicator Modal -->
        <div id="modal">
            <div class="modal-content">
                <div class="spinner"></div>
                <h3
                    id="modal-title"
                    style="
                        font-size: 1.1rem;
                        margin-bottom: 0.5rem;
                        color: #2d2621;
                    "
                >
                    Waiting for Host Approval
                </h3>
                <p
                    id="modal-text"
                    style="font-size: 0.8rem; margin-bottom: 1.5rem"
                >
                    Your Kiwi download request has been sent to the instructor.
                    Please stand by...
                </p>
                <button
                    onclick="closeModal()"
                    style="
                        background: #e2d9cc;
                        color: #2d2621;
                        border: none;
                        padding: 0.5rem 1rem;
                        border-radius: 0.5rem;
                        cursor: pointer;
                        font-size: 0.75rem;
                        font-weight: 600;
                    "
                >
                    Cancel
                </button>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
    </body>
</html>
