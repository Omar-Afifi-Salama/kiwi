<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Club Local Drop - Download Files</title>
        <style>
            :root {
                --bg-primary: #020617;
                --bg-card: #0f172a;
                --border-color: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --accent-indigo: #6366f1;
                --accent-indigo-hover: #4f46e5;
                --accent-emerald: #10b981;
                --accent-rose: #f43f5e;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: system-ui, sans-serif;
            }
            body {
                background-color: var(--bg-primary);
                color: var(--text-main);
                padding: 2rem;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .container {
                width: 100%;
                max-width: 500px;
                background-color: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: 1rem;
                padding: 2rem;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            }
            h1 {
                font-size: 1.5rem;
                color: var(--accent-indigo);
                margin-bottom: 0.5rem;
            }
            p {
                font-size: 0.875rem;
                color: var(--text-muted);
                margin-bottom: 1.5rem;
            }
            .scroll-box {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
                max-height: 20rem;
                overflow-y: auto;
            }
            .file-card {
                background-color: #020617;
                border: 1px solid var(--border-color);
                padding: 1rem;
                border-radius: 0.75rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
            }
            .file-name {
                color: var(--accent-emerald);
                font-family: monospace;
                font-size: 0.875rem;
                word-break: break-all;
                overflow-wrap: break-word;
                flex: 1;
            }
            .download-btn {
                background-color: var(--accent-indigo);
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                border-radius: 0.5rem;
                font-weight: 600;
                font-size: 0.75rem;
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.2s;
            }
            .download-btn:hover {
                background-color: var(--accent-indigo-hover);
            }
            .italic-muted {
                color: #475569;
                font-style: italic;
                text-align: center;
                padding: 2rem;
                font-size: 0.875rem;
            }

            /* Modal Overlay for Approval Status */
            #modal {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(2, 6, 23, 0.85);
                backdrop-filter: blur(4px);
                justify-content: center;
                align-items: center;
                z-index: 50;
                padding: 1rem;
            }
            .modal-content {
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                padding: 2rem;
                border-radius: 1rem;
                max-width: 400px;
                width: 100%;
                text-align: center;
                space-y: 1rem;
            }
            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(99, 102, 241, 0.2);
                border-top-color: var(--accent-indigo);
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin: 0 auto 1rem auto;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>🚀 Club Local Drop</h1>
            <p>Select a workshop file below to download.</p>

            <div id="file-list" class="scroll-box">
                <div class="italic-muted">Loading available files...</div>
            </div>
        </div>

        <!-- Waiting Indicator Modal -->
        <div id="modal">
            <div class="modal-content">
                <div class="spinner"></div>
                <h3
                    id="modal-title"
                    style="
                        font-size: 1.1rem;
                        margin-bottom: 0.5rem;
                        color: #f8fafc;
                    "
                >
                    Waiting for Host Approval
                </h3>
                <p
                    id="modal-text"
                    style="font-size: 0.8rem; margin-bottom: 1.5rem"
                >
                    Your download request has been sent to the instructor.
                    Please wait...
                </p>
                <button
                    onclick="closeModal()"
                    style="
                        background: #334155;
                        color: white;
                        border: none;
                        padding: 0.5rem 1rem;
                        border-radius: 0.5rem;
                        cursor: pointer;
                        font-size: 0.75rem;
                    "
                >
                    Cancel
                </button>
            </div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            const socket = io();

            socket.on("state-update", (data) => {
                const fileList = document.getElementById("file-list");
                const filesArr = Object.values(data.files);

                if (filesArr.length === 0) {
                    fileList.innerHTML =
                        '<div class="italic-muted">No files hosted at the moment. Check back soon!</div>';
                } else {
                    fileList.innerHTML = filesArr
                        .map(
                            (f) => `
                    <div class="file-card">
                        <span class="file-name">${f.name}</span>
                        <button onclick="requestDownload('${f.id}', '${f.name}')" class="download-btn">Download</button>
                    </div>
                `,
                        )
                        .join("");
                }
            });

            async function requestDownload(fileId, fileName) {
                const modal = document.getElementById("modal");
                const modalTitle = document.getElementById("modal-title");
                const modalText = document.getElementById("modal-text");

                modalTitle.innerText = "⏳ Waiting for Host Approval";
                modalText.innerText = `Requesting "${fileName}" from host. Please wait...`;
                modal.style.display = "flex";

                try {
                    const response = await fetch(`/download/${fileId}`);

                    if (response.ok) {
                        modalTitle.innerText = "✅ Download Approved!";
                        modalText.innerText =
                            "Your file download is starting...";

                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        window.URL.revokeObjectURL(url);

                        setTimeout(() => {
                            modal.style.display = "none";
                        }, 2000);
                    } else {
                        modalTitle.innerText = "❌ Request Denied";
                        modalText.innerText =
                            "The host rejected or timed out your download request.";
                    }
                } catch (err) {
                    modalTitle.innerText = "❌ Connection Error";
                    modalText.innerText =
                        "Failed to communicate with the host server.";
                }
            }

            function closeModal() {
                document.getElementById("modal").style.display = "none";
            }
        </script>
    </body>
</html>
