name: Test, Build & Release Binaries

on:
    push:
        tags:
            - "v*" # Triggers automatically when you push a version tag like v1.0.0

jobs:
    test:
        name: Run Test Suite
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Run Tests
              run: bun test

    release:
        name: Build and Release Kiwi with Assets
        needs: test
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Compile Standalone Binaries
              run: |
                  mkdir -p release-artifacts

                  echo "Building for Linux..."
                  bun build --compile --target=bun-linux-x64 ./src/index.ts --asset ./public --external react-devtools-core --outfile release-artifacts/kiwi-linux-x64

                  echo "Building for Windows..."
                  bun build --compile --target=bun-windows-x64 ./src/index.ts --asset ./public --windows-icon ./icons/kiwi-icon.ico --external react-devtools-core --outfile release-artifacts/kiwi-win-x64.exe 

                  echo "Building for macOS..."
                  bun build --compile --target=bun-darwin-arm64 ./src/index.ts --asset ./public --macos-icon ./icons/kiwi-icon.icns --external react-devtools-core --outfile release-artifacts/kiwi-mac-arm64

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release-artifacts/*
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
