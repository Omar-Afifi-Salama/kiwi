name: Test, Build & Release Binaries

on:
    push:
        tags:
            - "v*"

jobs:
    test:
        name: Run Test Suite
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Run Tests
              run: bun test

    release:
        name: Build and Release Kiwi Binaries
        needs: test
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      file_name: kiwi-linux-x64
                      build_cmd: bun build --compile --target=bun-linux-x64 ./src/index.ts --asset ./public --outfile release-artifacts/kiwi-linux-x64

                    - os: windows-latest
                      file_name: kiwi-win-x64.exe
                      build_cmd: bun build --compile --target=bun-windows-x64 ./src/index.ts --asset ./public --windows-icon ./icons/kiwi-icon.ico --outfile release-artifacts/kiwi-win-x64.exe

                    - os: macos-latest
                      file_name: kiwi-mac-arm64
                      build_cmd: bun build --compile --target=bun-darwin-arm64 ./src/index.ts --asset ./public --macos-icon ./icons/kiwi-icon.icns --outfile release-artifacts/kiwi-mac-arm64

        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Compile Standalone Binary
              shell: bash
              run: |
                  mkdir -p release-artifacts
                  ${{ matrix.build_cmd }}

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: release-artifacts/${{ matrix.file_name }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
