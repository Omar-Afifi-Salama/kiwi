name: Test, Build & Release Binaries

on:
    push:
        tags:
            - "v*" # Triggers automatically when you push a version tag like v1.0.0

jobs:
    test:
        name: Run Test Suite
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Run Tests
              run: bun test

    release:
        name: Build and Release Kiwi with Assets
        needs: test
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install Dependencies
              run: bun install

            - name: Compile Standalone Binaries
              run: |
                  mkdir -p dist-bin

                  echo "Building for Linux..."
                  bun build --compile --target=bun-linux-x64 ./src/index.ts --outfile dist-bin/kiwi-linux-x64

                  echo "Building for Windows (with embedded icon)..."
                  bun build --compile --target=bun-windows-x64 ./src/index.ts --outfile dist-bin/kiwi-win-x64.exe --windows-icon public/kiwi.ico

                  echo "Building for macOS..."
                  bun build --compile --target=bun-darwin-arm64 ./src/index.ts --outfile dist-bin/kiwi-mac-arm64

            - name: Package Binaries with Public Assets
              run: |
                  mkdir -p release-artifacts

                  # 1. Package Linux
                  mkdir -p build-linux
                  cp dist-bin/kiwi-linux-x64 build-linux/kiwi
                  cp -r public build-linux/public
                  tar -czvf release-artifacts/kiwi-linux-x64.tar.gz -C build-linux .

                  # 2. Package Windows (.zip includes executable + public assets folder)
                  mkdir -p build-win
                  cp dist-bin/kiwi-win-x64.exe build-win/kiwi.exe
                  cp -r public build-win/public
                  zip -r release-artifacts/kiwi-win-x64.zip build-win

                  # 3. Package macOS
                  mkdir -p build-mac
                  cp dist-bin/kiwi-mac-arm64 build-mac/kiwi
                  cp -r public build-mac/public
                  tar -czvf release-artifacts/kiwi-mac-arm64.tar.gz -C build-mac .

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      release-artifacts/*
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
